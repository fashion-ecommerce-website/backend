name: CI/CD Pipeline - Auto Deploy to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "🚀 Starting automated deployment on EC2..."

            # 1. Navigate to the backend directory on EC2
            if [ -d "$HOME/Backend" ]; then
              cd "$HOME/Backend"
            elif [ -d "$HOME/backend" ]; then
              cd "$HOME/backend"
            else
              echo "❌ Backend project directory not found on EC2!"
              exit 1
            fi

            echo "📂 Current working directory: $(pwd)"

            # 2. Pull the latest source code from main branch
            echo "📥 Pulling latest changes from GitHub origin/main..."
            git fetch origin main
            git reset --hard origin/main

            # 3. Rebuild and restart the Spring Boot container without affecting PostgreSQL & Redis
            echo "🔨 Rebuilding and restarting the backend container..."
            docker compose up -d --build --no-deps app

            # 4. Clean up unused and dangling Docker images to save disk space
            echo "🧹 Pruning unused Docker images..."
            docker image prune -f

            echo "✅ Deployment completed successfully!"
